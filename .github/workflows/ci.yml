name: Build Tweak

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: 'https://github.com'
          theos-sdks: 'https://github.com'
          theos-sdks-branch: 'master'

      - name: Compile Tweak
        run: |
          make package NO_PACKAGE=1

      - name: Upload Finished Dylib
        uses: actions/upload-artifact@v4
        with:
          name: AgarIoBotTweak-Dylib
          path: .theos/obj/debug/AgarIoBotTweak.dylib
